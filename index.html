<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12141A" />
    <meta name="description" content="СЛОВО — угадай слово из 5 букв за 5 попыток." />
    <title>СЛОВО</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Unbounded:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="header">
        <div class="wordmark" aria-label="СЛОВО">
          <span class="wordmark-tile">С</span>
          <span class="wordmark-tile">Л</span>
          <span class="wordmark-tile">О</span>
          <span class="wordmark-tile">В</span>
          <span class="wordmark-tile">О</span>
        </div>
        <div class="header-actions">
          <button type="button" class="btn-icon" id="help-btn" aria-label="Как играть">?</button>
          <a
            class="btn-icon btn-icon--link"
            href="https://github.com/askomarov/wordle-rus"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Репозиторий на GitHub"
            title="GitHub"
          >
            <svg class="btn-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"
              />
            </svg>
          </a>
          <button type="button" class="btn-new" id="new-game-btn">Новая игра</button>
        </div>
      </header>

      <div class="toast-shelf" aria-live="polite">
        <div class="toast" id="toast" hidden></div>
      </div>

      <main class="main">
        <div class="board" id="board" aria-label="Игровое поле"></div>
      </main>

      <div class="keyboard" id="keyboard" aria-label="Клавиатура"></div>

      <div class="error-banner" id="error-banner" hidden></div>
    </div>

    <dialog id="help-dialog" class="help-dialog" closedby="any" aria-labelledby="help-title">
      <h2 id="help-title" class="help-title">Как играть</h2>
      <p class="help-lead">Угадай слово из 5 букв за 5 попыток.</p>
      <ul class="help-examples">
        <li>
          <span class="tile tile--correct help-tile">С</span>
          <span class="help-caption"><strong>Зелёный</strong> — буква на своём месте.</span>
        </li>
        <li>
          <span class="tile tile--present help-tile">Л</span>
          <span class="help-caption"><strong>Оранжевый</strong> — буква есть, но не здесь.</span>
        </li>
        <li>
          <span class="tile tile--absent help-tile">О</span>
          <span class="help-caption"><strong>Серый</strong> — такой буквы в слове нет.</span>
        </li>
      </ul>
      <p class="help-dict">
        <button type="button" class="help-dict-open" data-open-dict>Поиск по словарю</button>
      </p>
      <form method="dialog">
        <button type="submit" class="btn-primary" id="help-got-it">Понятно</button>
      </form>
    </dialog>


    <dialog id="dict-dialog" class="dict-dialog" closedby="any" aria-labelledby="dict-dialog-title">
      <div class="dict-dialog-inner" data-words-search>
        <div class="dict-dialog-header">
          <div>
            <h2 id="dict-dialog-title" class="dict-dialog-title">Словарь</h2>
            <p class="dict-dialog-lead">
              Маска из 5 слотов: буква фиксирует позицию, пусто или <kbd>_</kbd> — любая.
            </p>
          </div>
        </div>
            <div class="pattern-row" id="dict-pattern-row" role="group" aria-label="Маска из 5 букв">
              <input class="pattern-slot" type="text" inputmode="text" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Буква 1" data-index="0" />
              <input class="pattern-slot" type="text" inputmode="text" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Буква 2" data-index="1" />
              <input class="pattern-slot" type="text" inputmode="text" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Буква 3" data-index="2" />
              <input class="pattern-slot" type="text" inputmode="text" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Буква 4" data-index="3" />
              <input class="pattern-slot" type="text" inputmode="text" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Буква 5" data-index="4" />
            </div>
        <p class="words-count" data-words-count aria-live="polite"></p>
        <div class="words-list-wrap">
          <ul class="words-list" data-words-list></ul>
        </div>
        <div class="dict-dialog-footer">
          <form method="dialog">
            <button type="submit" class="btn-primary">Закрыть</button>
          </form>
        </div>
      </div>
    </dialog>

    <script src="js/words.js"></script>
    <script src="js/words-page.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/words-boot.js"></script>
  </body>
</html>
