<!DOCTYPE html>
<html lang="ru">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12141A" />
    <meta name="description" content="Словарь СЛОВО — все доступные слова и поиск по маске." />
    <title>Словарь — СЛОВО</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Unbounded:wght@600;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <div class="app app--words" id="app">
      <header class="header">
        <a class="wordmark wordmark--link" href="index.html" aria-label="СЛОВО — на главную">
          <span class="wordmark-tile">С</span>
          <span class="wordmark-tile">Л</span>
          <span class="wordmark-tile">О</span>
          <span class="wordmark-tile">В</span>
          <span class="wordmark-tile">О</span>
        </a>
        <div class="header-actions">
          <a class="btn-new" href="index.html">К игре</a>
        </div>
      </header>

      <main class="words-page" data-words-search>
        <h1 class="words-title">Словарь</h1>
        <p class="words-lead">
          Все слова, которые можно ввести в игре. Задай маску из 5 слотов —
          буква фиксирует позицию, пусто или <kbd>_</kbd> — любая буква.
        </p>

        <div class="pattern-row" id="pattern-row" role="group" aria-label="Маска из 5 букв">
          <input class="pattern-slot" type="text" inputmode="text" maxlength="1" autocomplete="off"
            autocapitalize="characters" spellcheck="false" aria-label="Буква 1" data-index="0" />
          <input class="pattern-slot" type="text" inputmode="text" maxlength="1" autocomplete="off"
            autocapitalize="characters" spellcheck="false" aria-label="Буква 2" data-index="1" />
          <input class="pattern-slot" type="text" inputmode="text" maxlength="1" autocomplete="off"
            autocapitalize="characters" spellcheck="false" aria-label="Буква 3" data-index="2" />
          <input class="pattern-slot" type="text" inputmode="text" maxlength="1" autocomplete="off"
            autocapitalize="characters" spellcheck="false" aria-label="Буква 4" data-index="3" />
          <input class="pattern-slot" type="text" inputmode="text" maxlength="1" autocomplete="off"
            autocapitalize="characters" spellcheck="false" aria-label="Буква 5" data-index="4" />
        </div>

        <p class="words-count" id="words-count" data-words-count aria-live="polite"></p>
        <div class="words-list-wrap">
          <ul class="words-list" id="words-list" data-words-list></ul>
        </div>
      </main>
    </div>

    <script src="js/words.js"></script>
    <script src="js/words-page.js"></script>
    <script src="js/words-boot.js"></script>
  </body>

</html>
